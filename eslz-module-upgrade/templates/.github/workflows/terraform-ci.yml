# .github/workflows/terraform-ci.yml
#
# Substitution tokens: none — this file is provider-agnostic.
#
# IMPORTANT: Before committing, verify every action version with:
#   gh release view --repo actions/checkout             --json tagName -q .tagName
#   gh release view --repo hashicorp/setup-terraform    --json tagName -q .tagName
#   gh release view --repo terraform-linters/setup-tflint --json tagName -q .tagName
# Never copy version pins without verifying — they go stale.
#
# No Azure credentials needed — mock_provider intercepts all API calls in tests.
name: Terraform CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  terraform:
    name: Terraform Validate and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@__VERIFY_CHECKOUT_VERSION__

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@__VERIFY_SETUP_TERRAFORM_VERSION__
        with:
          terraform_version: "~>1.9"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@__VERIFY_SETUP_TFLINT_VERSION__

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: TFLint Init
        run: tflint --init

      - name: TFLint
        run: tflint --recursive

      - name: Terraform Test
        run: terraform test
