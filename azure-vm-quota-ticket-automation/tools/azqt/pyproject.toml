[project]
name = "azqt"
version = "0.1.0"
description = "Azure Quota Ticket CLI - deterministic backend for the azure-vm-quota-ticket-automation skill"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests==2.34.2",
    "msal==1.37.0",
]

[project.scripts]
azqt = "azqt.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/azqt"]
